# 本番のGitHub Pagesへ、公開してよいファイルだけを配信する（tools/build-site.js の許可リスト）。
# tests/・tools/・CLAUDE.md などの開発用ファイルは配信しない。
# 有効にするには、リポジトリの Settings → Pages → Build and deployment の Source を
# 「GitHub Actions」に切り替える（切り替えるまでは、従来どおりブランチの全ファイルが配信される）。
# 鍵・セットアップリンクはこのワークフローでは一切扱わない（リポジトリの外にあり、配信用フォルダの検査で混入を拒否する）。
name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（コミットの指紋で固定。2026-11-01）
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4（コミットの指紋で固定。2026-11-01）
        with:
          node-version: 20
      - name: 配信用フォルダを作る（許可リスト・検査つき）
        run: node tools/build-site.js --out dist
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5（コミットの指紋で固定。2026-11-01）
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3（コミットの指紋で固定。2026-11-01）
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4（コミットの指紋で固定。2026-11-01）
